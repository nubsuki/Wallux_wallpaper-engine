<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallux</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- Startup Loader -->
    <div class="startup-screen" id="startup-screen">
        <div class="banter-loader">
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
            <div class="banter-loader__box"></div>
        </div>
        <!-- Cyber Mecha Loading Banner -->
        <div class="cyber-loader-banner">
            <div class="cyber-banner-top">
                <div class="cyber-badge">
                    <i class="fa-solid fa-globe cyber-globe-icon"></i>
                    <div class="cyber-badge-text">
                        <span class="cyber-badge-line1">NEKO</span>
                        <span class="cyber-badge-line2">FRAME</span>
                    </div>
                </div>
                <div class="cyber-text-track">
                    <p id="startup-text" class="cyber-text">WAITING FOR NEKOFRAME...</p>
                </div>
            </div>
            <!-- Bottom Slanted Animated Hazard Segments -->
            <div class="cyber-stripes-track">
                <span class="c-stripe" style="--i:0;"></span>
                <span class="c-stripe" style="--i:1;"></span>
                <span class="c-stripe" style="--i:2;"></span>
                <span class="c-stripe" style="--i:3;"></span>
                <span class="c-stripe" style="--i:4;"></span>
                <span class="c-stripe" style="--i:5;"></span>
                <span class="c-stripe" style="--i:6;"></span>
                <span class="c-stripe" style="--i:7;"></span>
                <span class="c-stripe" style="--i:8;"></span>
                <span class="c-stripe" style="--i:9;"></span>
                <span class="c-stripe" style="--i:10;"></span>
                <span class="c-stripe" style="--i:11;"></span>
                <span class="c-stripe" style="--i:12;"></span>
                <span class="c-stripe" style="--i:13;"></span>
                <span class="c-stripe" style="--i:14;"></span>
                <span class="c-stripe" style="--i:15;"></span>
            </div>
        </div>
    </div>

    <!-- Background Video -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="default.mp4" type="video/mp4">
    </video>

    <!-- Global Health Warning Banner -->
    <div class="health-banner" id="health-banner" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation warning-icon"></i>
        <span id="health-message">System Temperature Warning</span>
    </div>

    <!-- Centered Top Clock Widget -->
    <div class="clock-widget hud-panel" id="clock-widget" style="display: none;">
        <div class="time-block">
            <div class="time-row">
                <div class="time-text"><span id="time-hours">00</span>:<span id="time-minutes">00</span></div>
                <div class="time-meta-col">
                    <div class="weather-icon-wrapper">
                        <svg class="weather-icon moon" id="icon-moon" viewBox="0 0 512 512" style="display: none;">
                            <path fill="currentColor"
                                d="M283.211 512c78.962 0 151.079-35.925 198.857-94.792 7.068-8.708-.639-21.43-11.562-19.35-124.203 23.654-238.262-71.576-238.262-196.954 0-72.222 38.662-138.635 101.498-174.394 9.686-5.512 7.25-20.197-3.756-22.23A258.156 258.156 0 0 0 283.211 0c-141.309 0-256 114.511-256 256 0 141.309 114.511 256 256 256z" />
                        </svg>
                        <svg class="weather-icon sun" id="icon-sun" viewBox="0 0 512 512">
                            <path fill="currentColor"
                                d="M256 160c-52.9 0-96 43.1-96 96s43.1 96 96 96 96-43.1 96-96-43.1-96-96-96zm246.4 80.5l-94.7-47.3 33.5-100.4c4.5-13.6-8.4-26.5-21.9-21.9l-100.4 33.5-47.4-94.8c-6.4-12.8-24.6-12.8-31 0l-47.3 94.7L92.7 70.8c-13.6-4.5-26.5 8.4-21.9 21.9l33.5 100.4-94.7 47.4c-12.8 6.4-12.8 24.6 0 31l94.7 47.3-33.5 100.5c-4.5 13.6 8.4 26.5 21.9 21.9l100.4-33.5 47.3 94.7c6.4 12.8 24.6 12.8 31 0l47.3-94.7 100.4 33.5c13.6 4.5 26.5-8.4 21.9-21.9l-33.5-100.4 94.7-47.3c13-6.5 13-24.7.2-31.1zm-155.9 106c-49.9 49.9-131.1 49.9-181 0-49.9-49.9-49.9-131.1 0-181 49.9-49.9 131.1-49.9 181 0 49.9 49.9 49.9 131.1 0 181z" />
                        </svg>
                    </div>
                    <span id="time-ampm" class="time-sub-text">AM</span>
                </div>
            </div>
            <div class="day-text" id="day-text">THURSDAY, MARCH 27TH</div>
        </div>
    </div>

    <!-- Centered Processes Widget (Terminal Style - No BG / No Borders) -->
    <div class="process-widget" id="process-widget" style="display: none;">
        <div class="proc-table-header">
            <span class="col-pid">PID</span>
            <span class="col-name">Name</span>
            <span class="col-usage">Usage</span>
        </div>
        <div class="process-container" id="process-container">
            <!-- Processes injected here -->
        </div>
        <div class="proc-total-footer">
            <span>Operations: </span><span id="process-count">0</span>
        </div>
    </div>

    <!-- Metrics Widget: CPU, GPU, RAM Mecha Banners -->
    <div class="metrics-widget" id="metrics-widget" style="display: none;">
        <div class="mecha-metrics-stack">

            <!-- CPU Banner Card -->
            <div class="mecha-card hud-panel" id="metric-cpu-card">
                <div class="mecha-main-row">
                    <div class="mecha-hazard-stripes" id="stripes-cpu">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <div class="mecha-title-wrap">
                        <span class="mecha-title">CPU</span>
                        <span class="mecha-value" id="text-cpu">0%</span>
                    </div>
                </div>
                <div class="mecha-sub-row">
                    <div class="mecha-sub-bracket">
                        <span class="mecha-sub-text" id="name-cpu">CPU</span>
                        <span class="mecha-sub-divider">/</span>
                        <span class="mecha-sub-detail" id="temp-cpu">0°C</span>
                    </div>
                </div>
            </div>

            <!-- GPU Banner Card -->
            <div class="mecha-card hud-panel" id="metric-gpu-card">
                <div class="mecha-main-row">
                    <div class="mecha-hazard-stripes" id="stripes-gpu">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <div class="mecha-title-wrap">
                        <span class="mecha-title">GPU</span>
                        <span class="mecha-value" id="text-gpu">0%</span>
                    </div>
                </div>
                <div class="mecha-sub-row">
                    <div class="mecha-sub-bracket">
                        <span class="mecha-sub-text" id="name-gpu">GPU</span>
                        <span class="mecha-sub-divider">/</span>
                        <span class="mecha-sub-detail" id="temp-gpu">0°C</span>
                    </div>
                </div>

                <!-- GPU Dual Fan Module -->
                <div class="gpu-fan-module">
                    <div class="gpu-fan-top-line"></div>
                    <div class="gpu-fan-body">
                        <div class="gpu-fan-housings">
                            <div class="fan-housing">
                                <svg class="fan-turbine-svg" id="gpu-fan-blade-1" viewBox="0 0 100 100" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="50" cy="50" r="10" fill="#ffffff" />
                                    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
                                        <path d="M 50 38 C 50 22 66 12 78 14" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(45 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(90 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(135 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(180 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(225 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(270 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(315 50 50)" />
                                    </g>
                                </svg>
                            </div>
                            <div class="fan-housing">
                                <svg class="fan-turbine-svg" id="gpu-fan-blade-2" viewBox="0 0 100 100" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="50" cy="50" r="10" fill="#ffffff" />
                                    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
                                        <path d="M 50 38 C 50 22 66 12 78 14" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(45 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(90 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(135 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(180 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(225 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(270 50 50)" />
                                        <path d="M 50 38 C 50 22 66 12 78 14" transform="rotate(315 50 50)" />
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="gpu-fan-info">
                            <div class="gpu-fan-line1">
                                <span id="gpu-fan-rpm">0 RPM</span>
                                <span class="fan-divider">//</span>
                                <span id="gpu-fan-percent">0%</span>
                            </div>
                            <div class="gpu-fan-line2" id="gpu-fan-status">COOLING ACTIVE</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RAM Banner Card -->
            <div class="mecha-card hud-panel" id="metric-ram-card">
                <div class="mecha-main-row">
                    <div class="mecha-hazard-stripes" id="stripes-ram">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <div class="mecha-title-wrap">
                        <span class="mecha-title">RAM</span>
                        <span class="mecha-value" id="text-ram">0%</span>
                    </div>
                </div>
                <div class="mecha-sub-row">
                    <div class="mecha-sub-bracket">
                        <span class="mecha-sub-text" id="name-ram">RAM</span>
                        <span class="mecha-sub-divider">/</span>
                        <span class="mecha-sub-detail" id="val-ram">0GB</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- System Health Widget: Right Side of Processes -->
    <div class="health-widget hud-panel" id="health-widget" style="display: none;">
        <div class="diag-graphic-row">

            <!-- Cyber Data Matrix (Paired 2x2 Sub-Quads from Reference Image) -->
            <div class="cyber-data-matrix" id="cyber-matrix">
                <div class="matrix-pair">
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                </div>

                <div class="matrix-pair">
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                </div>

                <div class="matrix-pair">
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                </div>

                <div class="matrix-pair">
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                </div>

                <div class="matrix-pair">
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                </div>

                <div class="matrix-pair">
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                    <div class="sub-quad">
                        <span class="m-dot"></span><span class="m-dot"></span>
                        <span class="m-dot"></span><span class="m-dot"></span>
                    </div>
                </div>
            </div>

            <!-- Vertical Status Text -->
            <div class="diag-vertical-text">
                <span id="health-vertical-text">SYSTEM: HEALTHY</span>
            </div>

        </div>
    </div>

    <!-- Music Visualizer (Overlay) -->
    <div class="music-visualizer hud-panel" id="music-visualizer" style="display: none;">
        <div class="song-info" id="song-info" style="display: none;">
            <img id="song-image" src="" alt="">
            <p id="song-name"></p>
        </div>
        <canvas id="AudioCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>

</html>
